<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flag</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
    font-family: 'Courier New', monospace;
  }
  .flag-box {
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid #39ff14;
    border-radius: 12px;
    padding: 40px 60px;
    box-shadow: 0 0 25px #39ff14;
  }
  .flag-text {
    color: #39ff14;
    font-size: 1.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #39ff14;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="flag-box">
    <div class="flag-text">TBC{***********************}</div>
  </div>
</body>
</html>
